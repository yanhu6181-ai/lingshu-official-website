services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lingshu:${POSTGRES_PASSWORD}@postgres:5432/lingshu
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ["3000"]
    networks: [web, data]
  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://lingshu:${POSTGRES_PASSWORD}@postgres:5432/lingshu
    command: npm run db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lingshu
      POSTGRES_USER: lingshu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingshu -d lingshu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on: [app]
    networks: [web]
volumes:
  postgres_data:
networks:
  web:
  data:
    internal: true
